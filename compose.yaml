services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: bvv
      POSTGRES_PASSWORD: bvv_local_demo_only
      POSTGRES_DB: banviviet
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bvv_g2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bvv -d banviviet"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bvv_g2_pg:
